<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1224"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 300) scale(520)">
      <stop stop-color="#4F46E5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dieBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="dieSheen" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="liveGlowOg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(354 158) scale(78)">
      <stop stop-color="#FBBF24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#pageBg)"/>
  <rect width="1200" height="630" fill="url(#halo)"/>

  <!-- Brand mark -->
  <svg x="96" y="199" width="232" height="232" viewBox="0 0 512 512">
    <rect width="512" height="512" rx="116" fill="url(#dieBg)"/>
    <rect width="512" height="512" rx="116" fill="url(#dieSheen)"/>
    <circle cx="354" cy="158" r="78" fill="url(#liveGlowOg)"/>
    <g fill="#FFFFFF">
      <circle cx="158" cy="158" r="42"/>
      <circle cx="256" cy="256" r="42"/>
      <circle cx="158" cy="354" r="42"/>
      <circle cx="354" cy="354" r="42"/>
    </g>
    <circle cx="354" cy="158" r="45" fill="#FBBF24"/>
  </svg>

  <!-- Text block -->
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="384" y="238" fill="#818CF8" font-size="26" font-weight="700" letter-spacing="4">GAMES NIGHT</text>
    <text x="382" y="322" fill="#FFFFFF" font-size="72" font-weight="800">Play together,</text>
    <text x="382" y="404" fill="#FFFFFF" font-size="72" font-weight="800">follow live.</text>
    <text x="384" y="470" fill="#94A3B8" font-size="30" font-weight="500">Teams, rounds, turns &amp; scoring — on every screen.</text>
  </g>

  <text x="384" y="540" fill="#64748B" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="600">thegamesnight.com</text>
</svg>
